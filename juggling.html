<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>3볼 저글링 캐스케이드 배우기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 레이아웃: 한 화면. 왼쪽 60% 검은 무대(제목·짧은 설명), 오른쪽 40%에 1~4차시 버튼(누르면 그 차시 슬라이드로). 좁은 화면에서는 위아래로.
   색·글꼴은 강의 덱(DESIGN.md)과 같게: 무대는 검정, 행동 파랑 하나, 공 색은 공에만. */
:root{
  color-scheme:dark;   /* 한 가지 어두운 모습: 왼쪽 검은 무대, 오른쪽은 덱의 어두운 면(dark) */
  --stage:#000; --on-stage:#f5f5f7; --on-stage-2:#a1a1a6;
  --bg:#1d1d1f; --card:#2a2a2d; --card-hover:#333337; --ink:#f5f5f7; --ink-2:#a1a1a6; --no:#3a3a3d;
  --action:#2997ff; --action-hi:#2997ff;
  --ball-a:#FF5C8A; --ball-b:#A78BFA; --ball-c:#FFA64D;
  --font:"Pretendard Variable","Pretendard","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);word-break:keep-all;-webkit-font-smoothing:antialiased}
.page{display:grid;grid-template-columns:6fr 4fr;height:100%;min-height:560px}

/* 왼쪽: 제목 */
.intro{background:var(--stage);color:var(--on-stage);display:flex;flex-direction:column;justify-content:center;padding:clamp(28px,6vw,96px)}
.balls{display:flex;gap:10px;margin-bottom:clamp(20px,4vh,40px)}
.balls i{width:clamp(22px,2.6vw,34px);aspect-ratio:1;border-radius:50%;display:block}
.eyebrow{margin:0;font-size:clamp(14px,1.2vw,17px);font-weight:600;letter-spacing:.04em;color:var(--on-stage-2)}
h1{margin:.35em 0 .5em;font-size:clamp(36px,5.4vw,84px);line-height:1.1;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
h1 b{color:var(--action-hi);font-weight:800}
.lead{margin:0;max-width:28em;font-size:clamp(16px,1.5vw,21px);line-height:1.6;color:var(--on-stage-2)}
.lead strong{color:var(--on-stage);font-weight:700}

/* 오른쪽: 차시 버튼 */
.lessons{display:flex;flex-direction:column;justify-content:center;gap:clamp(10px,1.6vh,16px);padding:clamp(24px,4vw,64px);margin:0;list-style:none}
.lessons a{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:16px;padding:clamp(16px,2.4vh,24px) clamp(18px,1.8vw,26px);
  border-radius:24px;background:var(--card);color:var(--ink);text-decoration:none;transition:background .15s,transform .15s}
.lessons a:hover{background:var(--card-hover);transform:translateX(4px)}
.lessons a:focus-visible{outline:3px solid var(--action);outline-offset:3px}
.no{display:grid;place-items:center;width:clamp(48px,4.4vw,60px);aspect-ratio:1;border-radius:50%;background:var(--no);color:var(--ink);font-size:clamp(15px,1.3vw,18px);font-weight:800;line-height:1.1;text-align:center}
.no small{display:block;font-size:.7em;font-weight:700}
.t{min-width:0}
.t strong{display:block;font-size:clamp(19px,1.7vw,24px);font-weight:800;line-height:1.3}
.t span{display:block;margin-top:2px;font-size:clamp(14px,1.1vw,16px);color:var(--ink-2)}
.go{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--action);color:#fff;font-size:20px;font-weight:700}

@media (max-width:820px){
  .page{grid-template-columns:1fr;height:auto;min-height:0}
  .intro{padding:40px 20px 32px}
  .lessons{padding:20px 16px 32px;justify-content:flex-start}
}
</style>
</head>
<body>
<div class="page">
  <section class="intro">
    <div class="balls" aria-hidden="true"><i style="background:var(--ball-a)"></i><i style="background:var(--ball-b)"></i><i style="background:var(--ball-c)"></i></div>
    <p class="eyebrow">저글링 4차시 수업</p>
    <h1><b>3볼 저글링</b><br>캐스케이드 배우기</h1>
    <p class="lead">공 3개, 손 2개. 내 손으로 만든 공으로 시작해 <strong>공 1개, 2개, 3개</strong>로 한 단계씩 올라가요. 4차시 동안 연습 17단계를 지나 3볼 캐스케이드에 도전해요.</p>
  </section>
  <ol class="lessons" aria-label="차시별 슬라이드">
    <li><a href="juggling1.html"><span class="no">1<small>차시</small></span><span class="t"><strong>저글링 볼 만들기</strong><span>연습에 쓸 공 3개 만들기</span></span><span class="go" aria-hidden="true">→</span></a></li>
    <li><a href="juggling2.html"><span class="no">2<small>차시</small></span><span class="t"><strong>공 1개로 연습</strong><span>지켜야 할 점 5가지 · 가. 1~3단계</span></span><span class="go" aria-hidden="true">→</span></a></li>
    <li><a href="juggling3.html"><span class="no">3<small>차시</small></span><span class="t"><strong>공 2개로 연습</strong><span>나. 4~10단계</span></span><span class="go" aria-hidden="true">→</span></a></li>
    <li><a href="juggling4.html"><span class="no">4<small>차시</small></span><span class="t"><strong>공 3개로 캐스케이드</strong><span>다. 11~17단계</span></span><span class="go" aria-hidden="true">→</span></a></li>
  </ol>
</div>

</body>
</html>
